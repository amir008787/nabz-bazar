<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نبض بازار</title>

<style>
body {
    margin: 0;
    font-family: Tahoma, sans-serif;
    background: #101827;
    color: white;
    padding: 20px;
}
header {
    text-align: center;
    margin-bottom: 25px;
}
h1 { color: #35d6a0; }
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(140px,1fr));
    gap: 15px;
}
.card {
    background: #1e2b40;
    padding: 20px;
    border-radius: 14px;
    text-align: center;
}
.name { color: #b9c7d9; }
.price {
    color: #35d6a0;
    font-size: 20px;
    font-weight: bold;
    margin-top: 12px;
}
button {
    display: block;
    margin: 25px auto;
    padding: 12px 25px;
    border: 0;
    border-radius: 10px;
    background: #35d6a0;
    font-size: 16px;
    cursor: pointer;
}
footer {
    text-align: center;
    margin-top: 30px;
    color: #aaa;
}
a { color: #35d6a0; }
</style>
</head>

<body>

<header>
    <h1>نبض بازار</h1>
    <p>قیمت لحظه‌ای بازار</p>
</header>

<div class="grid">
    <div class="card">
        <div class="name">دلار آمریکا</div>
        <div class="price" id="usd">در حال دریافت...</div>
    </div>

    <div class="card">
        <div class="name">تتر</div>
        <div class="price" id="usdt">در حال دریافت...</div>
    </div>

    <div class="card">
        <div class="name">طلای ۱۸ عیار</div>
        <div class="price" id="gram18">در حال دریافت...</div>
    </div>

    <div class="card">
        <div class="name">سکه تمام</div>
        <div class="price" id="coin_full">در حال دریافت...</div>
    </div>

    <div class="card">
        <div class="name">نیم سکه</div>
        <div class="price" id="coin_half">در حال دریافت...</div>
    </div>

    <div class="card">
        <div class="name">ربع سکه</div>
        <div class="price" id="coin_quarter">در حال دریافت...</div>
    </div>
</div>

<button onclick="updatePrices()">به‌روزرسانی قیمت‌ها</button>

<footer>
    <p id="updated">در انتظار دریافت قیمت‌ها...</p>
    <a href="https://talasanj.info">قیمت‌ها از طلاسنج</a>
</footer>

<script>
async function updatePrices() {
    try {
        const response = await fetch('/api/prices?t=' + Date.now());
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || 'خطا در دریافت اطلاعات');
        }

        const prices = data.prices;

        const items = ['usd', 'usdt', 'gram18', 'coin_full', 'coin_half', 'coin_quarter'];

        items.forEach(id => {
            const item = prices[id];
            document.getElementById(id).textContent =
                item && item.price != null
                ? Number(item.price).toLocaleString('fa-IR') + ' تومان'
                : 'ناموجود';
        });

        document.getElementById('updated').textContent =
            'آخرین به‌روزرسانی: ' +
            new Date(data.updated_at).toLocaleString('fa-IR');

    } catch (error) {
        document.getElementById('updated').textContent =
            'خطا: ' + error.message;
    }
}

updatePrices();
setInterval(updatePrices, 30000);
</script>

</body>
</html>
